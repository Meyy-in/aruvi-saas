# Render Blueprint — the Meyy API as one Docker web service with one persistent disk
# (Track A of docs/mobile_migration_plan.md, 2026-09-09).
#
# Apply once from the Render dashboard: New → Blueprint → this repo. Every later git push
# to the branch redeploys. Secrets marked `sync: false` are typed into the dashboard once
# and never live in the repo (.env.example's rule, kept).
#
# Region: singapore is Render's nearest to Chennai. Plan: a persistent disk needs a paid
# instance (free instances have no disk and sleep) — `starter` is the smallest that fits.
# A disk pins the service to ONE instance and deploys restart it (a few seconds of
# downtime per push) — acceptable for a beta; Supabase Postgres (Track C) removes the disk.

services:
  - type: web
    name: meyy-api
    runtime: docker
    region: singapore
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: aruvi-state
      mountPath: /var/aruvi
      sizeGB: 1
    envVars:
      - key: ARUVI_STATE_DIR
        value: /var/aruvi/state
      # Bucket B backend (Track C): `file` = the disk above; `postgres` = Supabase, with
      # ARUVI_DATABASE_URL set to the project's SESSION-POOLER connection string (Render is
      # IPv4-only; the direct db.<ref> host is IPv6). Migrate first:
      # aruvi-scripts/migrate_state_to_postgres.py, then flip.
      # ★ CUT OVER TO POSTGRES 2026-09-10 (Track C). The value lives IN THE FILE now: the
      # 2026-09-10 flip was made in the Render DASHBOARD, and a Blueprint sync reverts dashboard
      # values with an explicit `value:` back to the file — a redeploy on 2026-09-11 did exactly
      # that and the whole product fell back to the disk (+ header auth). File = source of truth;
      # the disk is rollback only (set back to `file` to roll back). Needs ARUVI_DATABASE_URL
      # (sync:false, dashboard) present, or the API 500s on every state read.
      - key: ARUVI_STATE_BACKEND
        value: postgres
      - key: ARUVI_DATABASE_URL
        sync: false
      - key: ARUVI_DATA_DIR
        value: /app/data/cloud/content
      # Comma-separated browser origins allowed to call the API. Native apps send no
      # Origin header, so this fences the WEB channel only. Set to the deployed web
      # origin(s); "*" keeps today's open dev behaviour.
      - key: ARUVI_CORS_ORIGINS
        value: "*"
      # Identity (Track B). `header` = the dev stub (empty header → the "local" user); `supabase`
      # verifies the real Bearer token and reads the teacher's mobile from it.
      # ★ CUT OVER TO SUPABASE 2026-09-10 (Track B), verified from Chrome. Same story as
      # ARUVI_STATE_BACKEND above: the dashboard flip was reverted by a Blueprint sync on
      # 2026-09-11, so the phone (and web) came in as "local". The value lives IN THE FILE now so
      # no redeploy can flip it back. Needs ARUVI_SUPABASE_URL (sync:false, dashboard) present,
      # or the API refuses to boot; ARUVI_SUPABASE_JWT_SECRET only if the project still signs
      # HS256 (this one migrated to ES256, so it stays unset).
      - key: ARUVI_AUTH_PROVIDER
        value: supabase
      - key: ARUVI_SUPABASE_URL
        sync: false
      - key: ARUVI_SUPABASE_JWT_SECRET
        sync: false
      # ON for the beta (founder, 2026-09-11): trial = any 3 chapters, then a manual grant
      # (aruvi-scripts/entitlement.py). OFF would make "trial" and "Subscribe" mean nothing.
      # The trial ledger's HMAC key (founder, 2026-09-18: a free trial is once per number, even
      # across an erasure — api/config.py TRIAL_LEDGER_KEY). Render generates it ONCE and keeps
      # it; a Blueprint sync does not regenerate an existing value. ⚠️ Never delete or rotate it:
      # a new key makes every ledger entry unmatchable, which silently reopens the loophole.
      - key: ARUVI_TRIAL_LEDGER_KEY
        generateValue: true
      - key: ARUVI_ENTITLEMENT_ENFORCED
        value: "1"
      - key: ARUVI_LP_YEAR
        value: "2026-27"
      # Outbound mail — same three-variable seam as dev.sh; absent → file outbox.
      - key: ARUVI_SMTP_HOST
        sync: false
      - key: ARUVI_SMTP_PORT
        value: "587"
      - key: ARUVI_SMTP_USER
        sync: false
      - key: ARUVI_SMTP_PASSWORD
        sync: false
      - key: ARUVI_WA_TOKEN
        sync: false
      - key: ARUVI_WA_PHONE_NUMBER_ID
        sync: false
      - key: ARUVI_WA_VERIFY_TOKEN
        sync: false
      - key: ARUVI_WA_APP_SECRET
        sync: false
      - key: ARUVI_MAIL_FROM
        sync: false
      - key: ARUVI_SUPPORT_ADDRESS
        value: support@meyy.in
